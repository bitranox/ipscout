[project]
name = "ipscout"
version = "2.5.2"
description = "Ping, traceroute and local-network inspection in pure Python - no subprocess, and no admin rights on the default paths"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # Never below 2.3.4: earlier releases discarded Click's return value in
    # run_cli, so a command reporting a negative answer via ctx.exit() exited 0.
    "lib_cli_exit_tools>=2.4.1",
    "pydantic>=2.14.1",
    "rich-click>=1.9.9",
]
license = { text = "MIT" }
authors = [{ name = "bitranox", email = "bitranox@gmail.com" }]
keywords = ["ping", "icmp", "traceroute", "network", "arp", "mac-address", "port-scan", "wake-on-lan", "cli"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "License :: OSI Approved :: MIT License",
  "Environment :: Console",
  "Operating System :: OS Independent",
  "Typing :: Typed",
]

# System packages required for CI runners (read by GitHub Actions workflow template)
# Format: "apt_package_name" for Ubuntu, future: {"apt": "...", "brew": "...", "choco": "..."}
[tool.ci]
system-dependencies-ubuntu = []
system-dependencies-macos = []
system-dependencies-windows-pip = []
system-dependencies-windows-choco = []
os = ["ubuntu-latest", "windows-latest", "macos-latest"]

[project.urls]
Homepage = "https://github.com/bitranox/ipscout"
Repository = "https://github.com/bitranox/ipscout.git"
Issues = "https://github.com/bitranox/ipscout/issues"

[project.optional-dependencies]
dev = [
  "pytest>=9.1.1",
  "pytest-cov>=7.1.0",
  "pytest-xdist>=3.8.0",
  "ruff>=0.17.3",
  "pyright[nodejs]>=1.1.414",
  "bandit>=1.9.4",
  "build>=1.6.1",
  "hatchling>=1.32.4",
  "twine>=7.0.0",
  # codecov-cli is disabled, not dropped: it requires click<8.3.0, which drags click back to
  # 8.2.1 - the version with CVE-2026-7246 (command injection in click.edit(), fixed in 8.3.3).
  # Nothing else here caps click, so with this line active the audit gate goes red on every
  # clean install. Leaving it off costs nothing: CI uploads coverage via codecov/codecov-action,
  # not this CLI, and "bmk codecov" resolves codecovcli from PATH and only warns when absent.
  # Re-enable once codecov-cli relaxes its click<8.3.0 pin.
  # "codecov-cli>=11.2.6",
  # Transitive CVE pins
  "click>=8.5.0",         # CVE-2026-7246
  "pip-audit>=2.10.1",
  "textual>=8.2.8",
  "import-linter>=2.15",
  "setuptools>=84.2.1",
  "rtoml>=0.14.0",
  "certifi>=2026.10.23",  # PYSEC-2026-4320
]

[project.scripts]
ipscout = "ipscout.cli:main"

[build-system]
requires = [
    "hatchling>=1.32.4",
]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ipscout"]
include = ["src/ipscout/py.typed"]

# An allowlist, never a denylist: hatchling reads only the root .gitignore, so tracked working
# files and files hidden through .git/info/exclude or a nested .gitignore (session records,
# review notes, helper scripts) would ship. tests/test_packaging.py builds the sdist and
# refuses any other top-level entry.
[tool.hatch.build.targets.sdist]
include = [
    "/src/ipscout",
    "/tests/*.py",
    "/docs",
    "/README.md",
    "/LICENSE",
    "/CHANGELOG.md",
    "/pyproject.toml",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.ruff]
line-length = 160
target-version = "py310"

[tool.ruff.lint]
select = [
  "E", "W",     # pycodestyle
  "F",           # pyflakes
  "I",           # isort
  "N",           # pep8-naming
  "UP",          # pyupgrade
  "B",           # bugbear
  "A",           # builtins shadowing
  "C4",          # comprehension simplification
  "C90",         # mccabe: cyclomatic complexity <= 10 (the house hard limit)
  "SIM",         # simplification
  "TCH",         # type-checking imports
  "RUF",         # ruff-specific
  "G",           # logging format (catches f-string in logger)
  "T20",         # print statements
  "PTH",         # pathlib preference
  "PLC", "PLE",  # pylint conventions/errors
  "S",           # flake8-bandit security checks
  "PERF",        # performance anti-patterns
  "ERA",         # eradicate dead/commented-out code
  "FBT",         # boolean trap (boolean positional args)
  "PLR",         # pylint refactor
  "PLW",         # pylint warnings
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# ignore the "unused import sys" in the jupyter notebook - which we need (it is a linter hickup)
# A `!cmd` never raises, so CI sees a failing shell command only through
# `assert _exit_code == N` after it: IPython injects `_exit_code` at run time (F821)
# and those asserts are the gate (S101).
"notebooks/*.ipynb" = ["F401", "F821", "S101"]
# Tests: assert is standard, test fixtures have passwords, magic values are clearer inline, temp paths
# are fine. PLC0415: local/deferred imports are a deliberate test idiom - some tests import inside the
# test body to exercise import-time and cache behaviour, so moving them to module top would defeat intent.
"tests/*.py" = ["S101", "S105", "S106", "S108", "T20", "PLR2004", "PLR0913", "FBT001", "FBT003", "PLC0415"]

[tool.ruff.lint.flake8-type-checking]
# Pydantic reads field annotations at runtime, so a type used only in a model field must stay a runtime import.
runtime-evaluated-base-classes = ["pydantic.BaseModel"]

[tool.pyright]
typeCheckingMode = "strict"
# Check against the declared floor, not whatever the local venv happens to run.
# Without this, a 3.14 development interpreter accepts typeshed symbols that are
# guarded to 3.14+ (ctypes _layout_, for one) and CI rejects them at the floor.
pythonVersion = "3.10"
extraPaths = [
  "src",
]
exclude = [
  "scripts/menu.py",
  ".venv*",
]

[tool.pytest.ini_options]
addopts = ["--doctest-modules"]
doctest_optionflags = ["ELLIPSIS", "NORMALIZE_WHITESPACE"]
pythonpath = ["src"]
markers = [
  "os_agnostic: test runs on every supported operating system",
  "os_windows: test exercises Windows-only behavior",
  "os_macos: test exercises macOS-only behavior",
  "os_posix: test exercises behavior requiring POSIX semantics",
  "os_linux: test exercises Linux-only behavior",
  "local_only: test only runs in local development environments (skipped in CI)",
  "integration: test reaches a real external network; skips cleanly when there is no route out",
  "host_mutating: test changes this host's network state (a static neighbour entry); runs only with IPSCOUT_HOST_WRITE_TESTS=1 and the privilege to do it",
]

[tool.coverage.run]
branch = true
parallel = false
data_file = ".coverage.unit"
source = ["src/ipscout"]

[tool.coverage.report]
omit = [
  "tests/*",
  # Platform-specific transport backends. Each one is genuinely exercised, but
  # only on its own operating system: measured in CI, transport_posix reaches
  # 87% on Linux and 22% on Windows, while transport_windows reaches 90% on
  # Windows and cannot execute at all elsewhere. Left in the percentage, each
  # backend reports as dead weight on the two platforms that cannot run it and
  # sinks the gate below its floor on every OS at once.
  #
  # They are omitted from the *percentage*, not from testing: both are covered
  # by per-OS marked suites that run in the CI matrix, and their layouts are
  # additionally pinned from any platform by tests/test_winapi_layout.py. The
  # gate therefore measures the portable core, which is the part it can measure
  # uniformly across the matrix. The interface backends are here for the same
  # reason: getifaddrs and GetAdaptersAddresses read the same facts through
  # APIs that exist on only one platform each, and the route, neighbour and
  # lease backends for the same reason again. The rule is applied to the
  # whole set rather than to whichever members happened to sink the number:
  # a per-platform backend is either measurable everywhere or not, and
  # omitting some while keeping others made routes_linux exempt while
  # neighbours_linux was not, which is not a distinction anything supports.
  "src/ipscout/transport_posix.py",
  "src/ipscout/transport_windows.py",
  "src/ipscout/interfaces_posix.py",
  "src/ipscout/interfaces_windows.py",
  "src/ipscout/routes_linux.py",
  "src/ipscout/routes_macos.py",
  "src/ipscout/routes_windows.py",
  "src/ipscout/neighbours_linux.py",
  "src/ipscout/neighbours_macos.py",
  "src/ipscout/neighbours_windows.py",
  "src/ipscout/leases_linux.py",
  "src/ipscout/dhcp_linux.py",
  "src/ipscout/dhcp_windows.py",
  "src/ipscout/dhcp_macos.py",
]
fail_under = 85
show_missing = true

[tool.coverage.json]
output = "coverage.json"
pretty_print = true

[tool.clean]
# Patterns to remove when running `make clean`
patterns = [
  "**/__pycache__",
  ".hypothesis",
  ".import_linter_cache",
  ".pytest_cache",
  ".ruff_cache",
  ".pyright",
  ".mypy_cache",
  ".tox",
  ".nox",
  ".eggs",
  "*.egg-info",
  "build",
  "dist",
  "htmlcov",
  ".coverage",
  "coverage.xml",
  "codecov.sh",
  ".cache",
  "result",
]

[tool.git]
# Default git remote for push/release commands
default-remote = "origin"

[tool.scripts.test]
# Configuration for CICD test runner
pytest-verbosity = "-vv"
coverage-report-file = "coverage.xml"
src-path = "src"

[tool.importlinter]
root_package = "ipscout"

[[tool.importlinter.contracts]]
name = "Layered dependencies point one way only"
type = "layers"
layers = [
  "ipscout.scan : ipscout.subnet : ipscout.portscan : ipscout.banner : ipscout.snmp : ipscout.mtu : ipscout.wol : ipscout.dhcp",
  "ipscout.api",
  "ipscout.traceroute",
  "ipscout.static_neighbours",
  "ipscout.neighbours",
  "ipscout.leases_linux",
  "ipscout.interfaces : ipscout.routes",
  "ipscout.service",
  "ipscout.factory",
  "ipscout.transport_posix : ipscout.transport_windows : ipscout.transport_tcp : ipscout.interfaces_posix : ipscout.interfaces_windows : ipscout.routes_linux : ipscout.routes_macos : ipscout.routes_windows : ipscout.neighbours_linux : ipscout.neighbours_macos : ipscout.neighbours_windows : ipscout.dhcp_linux : ipscout.dhcp_windows : ipscout.dhcp_macos",
  "ipscout.packet : ipscout.deadline : ipscout.resolve : ipscout.ports : ipscout.winapi : ipscout.netlink : ipscout.bsdroute : ipscout.arp : ipscout.tcpsyn : ipscout.pool : ipscout.sockerr : ipscout.unixio : ipscout.bootp : ipscout.bpf : ipscout.snmpber",
  "ipscout.models",
  "ipscout.errors",
]

[tool.pip-audit]
# Known vulnerabilities to ignore (unfixable or accepted risk). No exclusions. Verified
# 2026-07-29: pip-audit over the fully resolved tree (75 packages, --extra dev) reports no
# known vulnerabilities with nothing ignored, so the nine ids
# inherited from the template were all inert. An inert ignore is not free - it is a
# permanent blind spot for that id, so a future dependency carrying one would pass silently.
# Removed rather than kept: re-add an id here only when it actually fires and has no fix.
ignore-vulns = []

[tool.bashate]
# bashate style settings for .sh files (E003 excluded: indent handled by shfmt)
max-line-length = 120
ignores = ["E003"]

[tool.uv]
exclude-newer = "1 day"
exclude-newer-package = {lib-cli-exit-tools = false}
